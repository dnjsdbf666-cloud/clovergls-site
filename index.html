<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CLOVER GLS | 서비스 일시 중지</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      background: #f4f7f5;
      color: #17231d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 10%, rgba(32, 128, 77, .12), transparent 34%),
        linear-gradient(145deg, #f8faf9, #edf3ef);
    }
    main {
      width: min(100%, 620px);
      padding: clamp(40px, 8vw, 72px) clamp(28px, 7vw, 64px);
      border: 1px solid #dce7e0;
      border-radius: 24px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 24px 70px rgba(22, 59, 39, .12);
      text-align: center;
    }
    .mark {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      place-items: center;
      border-radius: 18px;
      background: #176c3b;
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 12px 24px rgba(23, 108, 59, .22);
    }
    .brand {
      margin: 0 0 26px;
      color: #176c3b;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.18;
      letter-spacing: -.04em;
    }
    p {
      margin: 22px auto 0;
      color: #617067;
      font-size: clamp(15px, 3.5vw, 18px);
      line-height: 1.75;
      word-break: keep-all;
    }
    .line {
      width: 48px;
      height: 3px;
      margin: 30px auto 0;
      border-radius: 99px;
      background: #30a866;
    }
    footer {
      margin-top: 26px;
      color: #8a968f;
      font-size: 12px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">C</div>
    <div class="brand">CLOVER GLS</div>
    <h1>서비스가 일시 중지되었습니다</h1>
    <p>
      현재 홈페이지 운영이 일시 중지된 상태입니다.<br>
      이용에 불편을 드려 죄송합니다.
    </p>
    <div class="line" aria-hidden="true"></div>
    <footer>Service temporarily unavailable</footer>
  </main>
</body>
</html>
